name: instagram_clone
description: An Instagram clone built with Flutter and GetX.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  get: ^4.6.5
  firebase_core: ^2.15.1
  firebase_auth: ^4.9.0
  cloud_firestore: ^4.9.1
  firebase_storage: ^11.2.6
  image_picker: ^1.0.4
  cached_network_image: ^3.2.3
  flutter_staggered_grid_view: ^0.7.0
  timeago: ^3.5.0
  uuid: ^4.0.0
  flutter_svg: ^2.0.7
  story_view: ^0.15.0
  shimmer: ^3.0.0
  flutter_image_compress: ^2.0.4
  path_provider: ^2.1.1
  google_fonts: ^5.1.0
  flutter_animate: ^4.2.0+1
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.3

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
